[CANAL]
largo = 10                  ; largo del canal
metodo_flujo = LETRERO      ; EQUIDAD | LETRERO | TICO
tiempo_letrero_ms = 2000
parametro_w = 3             ; cuantos barcos deben de pasar de cada lado

[SCHEDULER]
algoritmo = RR              ; RR | PRIO | SJF | STRN | FCFS |EDF | 
quantum_ms = 200
preemptivo = 1              ; 1 = sí, 0 = no

[BARCOS]
cantidad = 4                ; cantidad de barcos en cada lado 
velocidad_base = 1          ; velocidad de barco normal
cfg_default = 1                 ; 1 = sí, 0 = no
izquierda = NORMAL, NORMAL, PESQUERA, NORMAL
derecha = PATRULLA, NORMAL, NORMAL, PESQUERA

