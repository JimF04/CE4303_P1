[CANAL]
largo = 15                  ; largo del canal
metodo_flujo = TICO      ; EQUIDAD | LETRERO | TICO
tiempo_letrero_ms = 5000
parametro_w = 2             ; cuantos barcos deben de pasar de cada lado

[SCHEDULER]
algoritmo = SJF             ; RR | PRIO | SJF | STRN | FCFS |EDF | 
quantum_ms = 500
preemptivo = 1              ; 1 = sí, 0 = no

[BARCOS]
cantidad = 4              ; cantidad de barcos en cada lado 
velocidad_base = 1          ; velocidad de barco normal
prioridad_base = 1
cfg_default = 1                 ; 1 = sí, 0 = no
izquierda = NOR,PAT,PES        ; A = NORMAL, B = PESQUERA, C = PATRULLA
derecha = PAT,PES,NOR
