[CANAL]
largo = 20                  ; largo del canal
metodo_flujo = TICO      ; EQUIDAD | LETRERO | TICO
tiempo_letrero_ms = 2000
parametro_w = 3             ; cuantos barcos deben de pasar de cada lado

[SCHEDULER]
algoritmo = RR             ; RR | PRIO | SJF | STRN | FCFS |EDF | 
quantum_ms = 200
preemptivo = 1              ; 1 = sí, 0 = no

[BARCOS]
cantidad = 3                ; cantidad de barcos en cada lado 
velocidad_base = 1          ; velocidad de barco normal
prioridad_base = 1
cfg_default = 1                 ; 1 = sí, 0 = no
izquierda = NOR,PAT,PES         ; A = NORMAL, B = PESQUERA, C = PATRULLA
derecha = PAT,PES,NOR
